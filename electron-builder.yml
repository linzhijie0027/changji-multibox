directories:
  app: ./build
  output: ./out
appId: io.github.linzhijie0027.changjimultibox
electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish:
  provider: github
  owner: linzhijie0027
  repo: changji-multibox
extraFiles:
  - from: LICENSE.md
    to: LICENSE-Ferdium-Apache-2.0.md
  - from: NOTICE.changji.md
    to: NOTICE.changji.md
asarUnpack:
  - ./recipes
  - ./assets/fonts
  - ./assets/images/taskbar
  - ./assets/images/icons
protocols:
  name: 畅际多开
  schemes: [changji-multibox]
nsis:
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 畅际多开
  uninstallDisplayName: 畅际多开
  artifactName: "Changji-Multibox-Setup-${version}-${arch}.${ext}"
portable:
  artifactName: "Changji-Multibox-Portable-${version}-${arch}.${ext}"
  unpackDirName: Changji-Multibox-Unpacked
win:
  executableName: Changji-Multibox
  icon: ./build-helpers/images/changji.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
