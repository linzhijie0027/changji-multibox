name: 畅际多开 Windows 构建
on:
  push:
    branches: [changji]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      USE_HARD_LINKS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Package service recipes
        working-directory: recipes
        run: |
          pnpm install --no-frozen-lockfile
          pnpm package
      - name: Create app icon
        run: ./scripts/create-changji-icon.ps1
      - name: Verify branding
        run: node scripts/verify-changji.cjs
      - name: Run tests
        run: pnpm test --runInBand
      - name: Build Windows x64 installer and portable app
        run: pnpm build --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Changji-Multibox-Windows-x64
          path: |
            out/*.exe
            LICENSE.md
            NOTICE.changji.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'changji-v' + (Get-Content package.json | ConvertFrom-Json).version
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title '畅际多开 Windows' --notes-file NOTICE.changji.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = Get-ChildItem out/*.exe | ForEach-Object { $_.FullName }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
